<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas hidden, conversation full width, attach menu</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif">
<dc-import name="Main" theme="light" canvas-open="{{no}}" running="{{no}}" composer-menu="attach" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false };
  }
}
</script>
</body>
</html>
